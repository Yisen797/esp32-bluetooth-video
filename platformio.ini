; ESP32 蓝牙视频传输 — OpenMV → ESP32 → 手机(经典蓝牙 SPP)
; 板卡: ESP32-WROOM-32 (内置经典蓝牙 + BLE)
;
; 说明: BluetoothSerial 属于 Arduino-ESP32 内核, 无需额外 lib_deps。
;       经典蓝牙固件较大, 用 huge_app.csv 分区表 (3MB app, 无 OTA) 保证放得下。

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; 经典蓝牙固件大, 需要大一点的 app 分区
board_build.partitions = huge_app.csv

build_flags =
    -O2
    -D CORE_DEBUG_LEVEL=0
